<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Road Safety Co-Pilot (Camera-Free GPS ADAS) | Eye-In</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e1a;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --accent-cyan: #00f2fe;
            --accent-blue: #3b82f6;
            --hazard-red: #ef4444;
            --hazard-amber: #f59e0b;
            --safe-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg-main); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* ─── HEADER BAR ─── */
        .copilot-header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }
        .brand-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-pill {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .speed-pill span { font-size: 0.65rem; color: var(--accent-cyan); }

        .btn-sensor-status {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ─── MAIN MAP & RADAR VIEW ─── */
        .map-container {
            flex: 1;
            position: relative;
            width: 100%;
        }
        #safetyMap { width: 100%; height: 100%; z-index: 1; }

        /* ─── LIVE VOICE WARNING CARD (OVERLAY) ─── */
        .proximity-alert-card {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            max-width: 460px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(185, 28, 28, 0.95));
            border: 2px solid #ff3366;
            border-radius: 16px;
            padding: 14px 18px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
            display: none;
            align-items: center;
            justify-content: space-between;
            animation: alertPulse 0.9s infinite alternate;
        }

        @keyframes alertPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(239,68,68,0.6)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(239,68,68,0.9)); }
        }

        .alert-icon-wrap {
            font-size: 2rem;
            color: #fff;
            margin-right: 12px;
        }
        .alert-text-wrap h3 {
            font-size: 1.1rem;
            font-weight: 800;
        }
        .alert-text-wrap p {
            font-size: 0.85rem;
            color: #fee2e2;
            margin-top: 2px;
        }
        .alert-dist-badge {
            background: #fff;
            color: #b91c1c;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 6px 14px;
            border-radius: 12px;
            white-space: nowrap;
        }

        /* ─── 1-TAP QUICK REPORT TOUCHPAD ─── */
        .bottom-action-panel {
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            z-index: 1000;
            backdrop-filter: blur(16px);
        }

        .panel-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-report-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn-report {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-report:active {
            transform: scale(0.92);
        }

        .btn-report-pothole { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.12); }
        .btn-report-pothole:hover { background: rgba(245, 158, 11, 0.25); }

        .btn-report-breaker { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.12); }
        .btn-report-breaker:hover { background: rgba(59, 130, 246, 0.25); }

        .btn-report-stalled { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.12); }
        .btn-report-stalled:hover { background: rgba(239, 68, 68, 0.25); }

        .btn-report-obstacle { border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.12); }
        .btn-report-obstacle:hover { background: rgba(168, 85, 247, 0.25); }

        .btn-icon { font-size: 1.4rem; }
        .btn-title { font-size: 0.78rem; font-weight: 700; }

        /* ─── BOTTOM CONTROLS & TEST DRIVE ─── */
        .bottom-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 8px;
        }

        .btn-tool {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .btn-tool:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .btn-tool.active { background: var(--accent-cyan); color: #070a13; border-color: var(--accent-cyan); font-weight: 700; }

        /* ─── TOAST NOTIFICATION ─── */
        .toast-msg {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .btn-title { font-size: 0.7rem; }
            .btn-icon { font-size: 1.2rem; }
            .quick-report-grid { gap: 6px; }
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <header class="copilot-header">
        <a href="/" class="brand-logo">
            <i class="fa-solid fa-shield-halved" style="color: var(--accent-cyan); font-size: 1.3rem;"></i>
            <div class="brand-title">ROAD SAFETY CO-PILOT</div>
        </a>

        <div class="header-stats">
            <div class="speed-pill">
                <i class="fa-solid fa-gauge-high" style="color: var(--accent-cyan); font-size: 0.85rem;"></i>
                <span id="speedVal">00</span> <span>KM/H</span>
            </div>
            <div class="btn-sensor-status" id="sensorBadge">
                <i class="fa-solid fa-satellite-dish"></i> <span>GPS Live</span>
            </div>
        </div>
    </header>

    <!-- Main Map View -->
    <div class="map-container">
        <div id="safetyMap"></div>

        <!-- Proximity Warning Card -->
        <div id="alertCard" class="proximity-alert-card">
            <div style="display: flex; align-items: center;">
                <div class="alert-icon-wrap" id="alertIcon">🕳️</div>
                <div class="alert-text-wrap">
                    <h3 id="alertTitle">सावधान! गड्ढा है</h3>
                    <p id="alertDesc">कृपया गति धीमी रखें (Slow Down)</p>
                </div>
            </div>
            <div class="alert-dist-badge" id="alertDistBadge">45m</div>
        </div>
    </div>

    <!-- 1-Tap Quick Hazard Touchpad (No Camera Required) -->
    <div class="bottom-action-panel">
        <div class="panel-label">
            <span>⚡ 1-Tap Quick Report (ड्राइविंग के वक्त 1-क्लिक रिपोर्ट)</span>
            <span id="hazardCountBadge" style="color: var(--accent-cyan); font-family: 'Orbitron', monospace;">0 Hazards Nearby</span>
        </div>

        <div class="quick-report-grid">
            <button class="btn-report btn-report-pothole" onclick="quickReportHazard('pothole')">
                <span class="btn-icon">🕳️</span>
                <span class="btn-title">गड्ढा (Pothole)</span>
            </button>

            <button class="btn-report btn-report-breaker" onclick="quickReportHazard('speed_breaker')">
                <span class="btn-icon">〰️</span>
                <span class="btn-title">स्पीड ब्रेकर</span>
            </button>

            <button class="btn-report btn-report-stalled" onclick="quickReportHazard('stalled_vehicle')">
                <span class="btn-icon">🚨</span>
                <span class="btn-title">खराब गाड़ी</span>
            </button>

            <button class="btn-report btn-report-obstacle" onclick="quickReportHazard('obstacle')">
                <span class="btn-icon">🚧</span>
                <span class="btn-title">रोड काम / जाम</span>
            </button>
        </div>

        <!-- Tools & Test Simulation Row -->
        <div class="bottom-tools">
            <button class="btn-tool" id="btnTestDrive" onclick="toggleTestDrive()">
                <i class="fa-solid fa-car-side"></i> <span id="btnTestDriveText">▶️ Start Test Drive</span>
            </button>

            <button class="btn-tool active" id="btnVoiceToggle" onclick="toggleVoiceAlerts()">
                <i class="fa-solid fa-volume-high"></i> <span id="btnVoiceText">Voice: Hindi (ON)</span>
            </button>

            <button class="btn-tool" onclick="seedSampleHazards()">
                <i class="fa-solid fa-map-pin"></i> Load Sample Hazards
            </button>

            <button class="btn-tool" onclick="window.location.href='/'">
                <i class="fa-solid fa-house"></i> Home
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastMsg" class="toast-msg">✅ गड्ढे की लोकेशन सेव हो गई!</div>

    <!-- Leaflet JS & Custom Co-Pilot Logic -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/smart-safety.js"></script>
</body>
</html>
