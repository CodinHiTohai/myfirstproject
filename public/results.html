<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Results – Eye In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#0a0e17">

  <style>
    /* ── Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0e17; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }

    /* ── Navbar ─────────────────────────────────────────────── */
    .res-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(10,14,23,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .res-nav-left { display: flex; align-items: center; gap: 12px; }
    .res-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .res-logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#6366f1,#8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .res-logo-text { font-family:'Outfit',sans-serif; font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg,#6366f1,#a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .res-nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-action-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8; font-size: 0.82rem; font-weight: 500; font-family:'Inter',sans-serif;
      cursor: pointer; text-decoration: none; transition: all 0.2s;
    }
    .nav-action-btn:hover { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.3); color: #a78bfa; }

    /* Route info pill */
    .route-info-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 0.78rem; color: #a78bfa; font-weight: 600; max-width: 280px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .results-layout {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100vh;
      padding-top: 64px;
    }

    /* ── Mobile Tab Switcher ─────────────────────────────────── */
    .mobile-tabs {
      display: none;
      position: fixed; top: 64px; left: 0; right: 0; z-index: 400;
      background: rgba(10,14,23,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tab-row { display: grid; grid-template-columns: 1fr 1fr; }
    .mtab {
      padding: 10px; text-align: center;
      background: none; border: none; color: #64748b;
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }
    .mtab.active { color: #a78bfa; border-bottom-color: #6366f1; }

    /* ── Left Panel: Vehicle List ────────────────────────────── */
    .vehicle-list-panel {
      background: #0d1117;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .vehicle-list-panel::-webkit-scrollbar { width: 4px; }
    .vehicle-list-panel::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 2px; }

    .panel-top {
      padding: 18px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.01);
      position: sticky; top: 0; z-index: 10;
    }
    .panel-top h2 { font-family:'Outfit',sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .panel-subtitle { font-size: 0.8rem; color: #64748b; }
    .vehicle-count-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 8px; padding: 2px 8px; font-size: 0.72rem; color: #a78bfa; font-weight: 700;
      margin-top: 6px;
    }

    .vehicles-container { padding: 12px; flex: 1; }

    /* ── Vehicle Card ────────────────────────────────────────── */
    .vehicle-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .vehicle-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      opacity: 0; transition: opacity 0.25s;
    }
    .vehicle-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(99,102,241,0.15), 0 0 0 1px rgba(99,102,241,0.2);
      border-color: rgba(99,102,241,0.25);
    }
    .vehicle-card:hover::before { opacity: 1; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .card-left { display: flex; align-items: center; gap: 10px; }
    .vehicle-type-badge {
      width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .vehicle-type-badge.auto { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); }
    .vehicle-type-badge.bus  { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); }
    .vehicle-type-badge.car  { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); }

    .vehicle-card-name { font-size: 0.9rem; font-weight: 700; color: #e2e8f0; margin-bottom: 1px; }
    .vehicle-card-driver { font-size: 0.76rem; color: #64748b; margin-bottom: 2px; }

    .card-right { text-align: right; flex-shrink: 0; }
    .fare-badge-premium {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; font-weight: 700; font-size: 0.85rem;
      padding: 4px 10px; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
      margin-bottom: 4px;
    }
    .eta-badge-premium { font-size: 0.72rem; color: #6366f1; font-weight: 600; }

    /* Route line */
    .card-route {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.76rem; color: #64748b; margin-bottom: 10px;
    }
    .card-route-from, .card-route-to { color: #94a3b8; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-route-arrow { color: #334155; font-size: 0.7rem; }

    /* Seat progress bar */
    .seat-bar-wrap { margin-bottom: 10px; }
    .seat-bar-label { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 4px; }
    .seat-bar-label .available { color: #10b981; font-weight: 600; }
    .seat-bar-label .total { color: #475569; }
    .seat-progress-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .seat-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .seat-progress-fill.good { background: linear-gradient(90deg, #10b981, #34d399); }
    .seat-progress-fill.medium { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .seat-progress-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }

    /* Card footer */
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .star-rating { font-size: 0.72rem; color: #64748b; }
    .share-btn-card {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 9px; border-radius: 7px;
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
      color: #a78bfa; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .share-btn-card:hover { background: rgba(99,102,241,0.15); }

    /* ── Skeleton Loading ────────────────────────────────────── */
    .skeleton-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    }
    .skeleton-line {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* ── Empty State ─────────────────────────────────────────── */
    .empty-state-premium {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; text-align: center; flex: 1;
    }
    .empty-state-icon { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.6; }
    .empty-state-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
    .empty-state-desc { font-size: 0.85rem; color: #64748b; line-height: 1.6; }

    /* ── Map Panel ───────────────────────────────────────────── */
    .map-panel { position: relative; }
    #map { width: 100%; height: 100%; min-height: calc(100vh - 64px); }

    /* Leaflet Dark overrides */
    .leaflet-popup-content-wrapper {
      background: rgba(17,24,39,0.97) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
      color: #f1f5f9 !important;
      backdrop-filter: blur(12px);
    }
    .leaflet-popup-tip { background: rgba(17,24,39,0.97) !important; }
    .leaflet-popup-content { font-size: 0.82rem; margin: 10px 14px !important; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .map-popup-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
    .map-popup-info { color: #94a3b8; font-size: 0.78rem; }
    .vehicle-marker { background: none; border: none; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; }
    .vehicle-marker:hover { transform: scale(1.3); }

    /* ── Vehicle Detail Modal ─────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-glass {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto;
      position: relative;
      animation: modalSlideIn 0.35s cubic-bezier(0.34,1.2,0.64,1);
    }
    .modal-glass::-webkit-scrollbar { width: 4px; }
    .modal-glass::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 2px; }
    @keyframes modalSlideIn { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .modal-close-btn {
      position: absolute; top: 14px; right: 14px; z-index: 10;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: #ef4444; }

    /* Modal Hero */
    .modal-hero {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 28px 24px 20px;
      position: relative; overflow: hidden;
    }
    .modal-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%);
    }
    .modal-hero-top { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; margin-bottom: 16px; }
    .modal-vehicle-icon {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .modal-vehicle-icon.auto { background: rgba(245,158,11,0.15); border: 1.5px solid rgba(245,158,11,0.35); }
    .modal-vehicle-icon.bus  { background: rgba(59,130,246,0.15);  border: 1.5px solid rgba(59,130,246,0.35); }
    .modal-vehicle-icon.car  { background: rgba(16,185,129,0.15);  border: 1.5px solid rgba(16,185,129,0.35); }
    .modal-hero-title { font-family:'Outfit',sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 2px; }
    .modal-hero-sub { font-size: 0.82rem; color: #94a3b8; }

    .modal-stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; position: relative; z-index: 1; }
    .modal-stat-card {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .modal-stat-val { font-family:'Outfit',sans-serif; font-size: 1.3rem; font-weight: 700; }
    .modal-stat-val.purple { color: #a78bfa; }
    .modal-stat-val.green { color: #10b981; }
    .modal-stat-val.orange { color: #f59e0b; }
    .modal-stat-lbl { font-size: 0.68rem; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    /* Modal body */
    .modal-body { padding: 20px 24px; }

    /* Section heading inside modal */
    .modal-section-heading {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.88rem; font-weight: 700; color: #e2e8f0;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* Driver profile link */
    .driver-profile-link {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; cursor: pointer;
      transition: all 0.2s;
    }
    .driver-profile-link:hover { border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.05); }
    .driver-profile-left { display: flex; align-items: center; gap: 10px; }
    .driver-avatar-sm { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .driver-name-link { font-size: 0.88rem; font-weight: 600; color: #e2e8f0; }
    .driver-see-profile { font-size: 0.72rem; color: #64748b; }
    .driver-arrow { color: #6366f1; font-size: 1rem; }

    /* Seat section */
    .seat-section { margin-bottom: 20px; }
    .seat-legend { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .legend-chip {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.72rem; color: #64748b; font-weight: 500;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
    .legend-chip.available .legend-dot { background: rgba(16,185,129,0.5); border: 1px solid #10b981; }
    .legend-chip.occupied .legend-dot  { background: rgba(239,68,68,0.5); border: 1px solid #ef4444; }
    .legend-chip.selected .legend-dot  { background: rgba(99,102,241,0.8); border: 1px solid #6366f1; }
    .legend-chip.driver .legend-dot    { background: rgba(245,158,11,0.5); border: 1px solid #f59e0b; }
    .selection-counter {
      margin-top: 10px; padding: 8px 12px; border-radius: 8px;
      font-size: 0.8rem; color: #64748b; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06); text-align: center;
    }
    .selection-counter.has-selection { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.25); color: #a78bfa; }

    /* Booking form */
    .booking-section { margin-bottom: 16px; }
    .booking-input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .booking-input-wrap:focus-within { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.04); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
    .booking-input-icon { font-size: 1rem; flex-shrink: 0; }
    .booking-input {
      flex: 1; background: none; border: none; outline: none;
      color: #f1f5f9; font-family:'Inter',sans-serif; font-size: 0.88rem;
    }
    .booking-input::placeholder { color: #334155; }
    .phone-prefix { font-size: 0.82rem; color: #64748b; font-weight: 600; padding-right: 8px; border-right: 1px solid rgba(255,255,255,0.08); }

    /* Counters */
    .counters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .counter-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 12px; text-align: center;
    }
    .counter-label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .counter-controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .counter-btn {
      width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(99,102,241,0.3);
      background: rgba(99,102,241,0.08); color: #a78bfa; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: all 0.15s;
    }
    .counter-btn:hover { background: rgba(99,102,241,0.2); }
    .counter-value { font-family:'Outfit',sans-serif; font-size: 1.4rem; font-weight: 700; color: #e2e8f0; min-width: 28px; text-align: center; }
    .counter-hint { font-size: 0.68rem; color: #475569; margin-top: 4px; }

    /* OTP Section */
    .otp-section-wrap { margin-bottom: 16px; }
    .otp-send-btn {
      width: 100%; padding: 11px; border-radius: 10px;
      background: rgba(99,102,241,0.1); border: 1.5px solid rgba(99,102,241,0.3);
      color: #a78bfa; font-family:'Inter',sans-serif; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s; margin-bottom: 10px;
    }
    .otp-send-btn:hover { background: rgba(99,102,241,0.18); }
    .otp-input-row { display: flex; gap: 8px; }
    .otp-input {
      flex: 1; background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px 12px; color: #f1f5f9; font-family:'Inter',sans-serif;
      font-size: 1rem; text-align: center; letter-spacing: 4px; outline: none;
      transition: border-color 0.2s;
    }
    .otp-input:focus { border-color: rgba(99,102,241,0.5); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
    .otp-verify-btn {
      padding: 10px 16px; border-radius: 10px;
      background: linear-gradient(135deg,#10b981,#059669); border: none;
      color: white; font-family:'Inter',sans-serif; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .otp-verify-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Submit button */
    .booking-submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; font-family:'Inter',sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.25s; box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      margin-bottom: 12px;
    }
    .booking-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.45); }
    .booking-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Share section in modal */
    .share-section {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 14px; margin-bottom: 0;
    }
    .share-section-title { font-size: 0.82rem; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }
    .share-btns { display: flex; gap: 8px; }
    .share-btn-wa {
      flex: 1; padding: 9px; border-radius: 9px;
      background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.3);
      color: #22c55e; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.2s; text-decoration: none;
    }
    .share-btn-wa:hover { background: rgba(37,211,102,0.18); }
    .share-btn-copy {
      flex: 1; padding: 9px; border-radius: 9px;
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.25);
      color: #a78bfa; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.2s;
    }
    .share-btn-copy:hover { background: rgba(99,102,241,0.15); }

    /* ── User History Modal ───────────────────────────────────── */
    .history-overlay {
      position: fixed; inset: 0; z-index: 2100;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
    }
    .history-overlay.open { display: flex; }
    .history-card {
      background: #111827; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; width: 90%; max-width: 440px;
      max-height: 88vh; padding: 24px; position: relative;
      overflow: hidden; animation: modalSlideIn 0.35s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    .history-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .history-title { font-family:'Outfit',sans-serif; font-size: 1.2rem; font-weight: 700; }
    .close-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #64748b; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .close-btn:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
    .history-list { max-height: 55vh; overflow-y: auto; padding-right: 4px; }
    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 2px; }
    .history-ride-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    .history-ride-route { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #e2e8f0; }
    .history-ride-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: #64748b; }

    /* Phone input row */
    .phone-input-row { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .phone-input-prefix { font-size: 0.82rem; color: #64748b; font-weight: 600; padding-right: 8px; border-right: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
    .phone-input-field { flex: 1; background: none; border: none; outline: none; color: #f1f5f9; font-family:'Inter',sans-serif; font-size: 0.9rem; }

    /* ── Feedback Button (FAB) ────────────────────────────────── */
    .feedback-fab {
      position: fixed; bottom: 24px; right: 24px; z-index: 1500;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; color: white; font-size: 1.4rem; cursor: pointer;
      box-shadow: 0 8px 24px rgba(99,102,241,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .feedback-fab:hover { transform: scale(1.1) translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.6); }

    /* Feedback Modal */
    .feedback-overlay {
      position: fixed; inset: 0; z-index: 2200;
      display: none; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(10px);
    }
    .feedback-overlay.open { display: flex; }
    .feedback-sheet {
      width: 100%; max-width: 520px; background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px 24px 0 0; padding: 24px 24px 32px;
      animation: sheetUp 0.4s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    @keyframes sheetUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    .feedback-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 20px; }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .feedback-title { font-family:'Outfit',sans-serif; font-size: 1.2rem; font-weight: 700; }

    .feedback-type-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .feedback-type-chip {
      padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      color: #64748b; cursor: pointer; transition: all 0.2s;
    }
    .feedback-type-chip.active { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); color: #a78bfa; }
    .feedback-textarea {
      width: 100%; background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 12px; color: #f1f5f9;
      font-family:'Inter',sans-serif; font-size: 0.88rem; outline: none;
      resize: vertical; min-height: 90px; transition: border-color 0.2s;
    }
    .feedback-textarea:focus { border-color: rgba(99,102,241,0.5); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
    .feedback-textarea::placeholder { color: #334155; }
    .feedback-submit {
      width: 100%; margin-top: 12px; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 11px;
      color: white; font-family:'Inter',sans-serif; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.25s; box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .feedback-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.4); }

    /* ── Driver Profile Modal ─────────────────────────────────── */
    .dprofile-overlay {
      position: fixed; inset: 0; z-index: 2300;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); padding: 16px;
    }
    .dprofile-overlay.open { display: flex; }
    .dprofile-card {
      background: #111827; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto;
      animation: modalSlideIn 0.35s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    .dprofile-card::-webkit-scrollbar { width: 3px; }
    .dprofile-card::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 2px; }
    .dprofile-header { padding: 24px 20px 16px; background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.08)); border-bottom: 1px solid rgba(255,255,255,0.06); position: relative; }
    .dprofile-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .dprofile-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 10px; }
    .dprofile-name { font-family:'Outfit',sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
    .dprofile-vehicle { font-size: 0.8rem; color: #64748b; }
    .dprofile-body { padding: 16px 20px; }
    .dprofile-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
    .dprofile-stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px; text-align: center; }
    .dprofile-stat-val { font-family:'Outfit',sans-serif; font-size: 1.2rem; font-weight: 700; }
    .dprofile-stat-lbl { font-size: 0.65rem; color: #475569; text-transform: uppercase; margin-top: 2px; }
    .dprofile-reviews { margin-top: 8px; }
    .dprofile-review { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .dprofile-review-rating { color: #f59e0b; font-size: 0.8rem; margin-bottom: 4px; }
    .dprofile-review-comment { font-size: 0.82rem; color: #94a3b8; }

    /* ── Toast ──────────────────────────────────────────────── */
    #toastBox { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column-reverse; gap: 8px; align-items: center; pointer-events: none; }
    .toast-item { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; font-size: 0.88rem; font-weight: 500; min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); backdrop-filter: blur(10px); opacity: 0; transform: translateY(16px) scale(0.95); transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events: auto; white-space: nowrap; }
    .toast-item.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast-item.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .toast-item.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .toast-item.warning { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
    .toast-item.info    { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }
    .toast-item.danger  { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

    /* ── Mobile Responsive ───────────────────────────────────── */
    @media (max-width: 768px) {
      .mobile-tabs { display: block; }
      .results-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 55vh 1fr;
        padding-top: 64px;
        height: auto; min-height: 100vh;
      }
      .map-panel { height: 55vh; order: -1; }
      #map { height: 55vh; min-height: unset; }
      .vehicle-list-panel { margin-top: 40px; /* space for tabs */ min-height: 50vh; }
      .vehicle-list-panel.hidden { display: none; }
      .map-panel.hidden { display: none; }
      .feedback-fab { bottom: 16px; right: 16px; width: 46px; height: 46px; font-size: 1.2rem; }
      .modal-glass { border-radius: 16px; }
      .modal-hero { padding: 20px 18px 16px; }
      .modal-body { padding: 16px 18px; }
      .route-info-pill { display: none; }
    }
    @media (max-width: 480px) {
      .res-nav { padding: 0 14px; }
      .modal-glass { max-width: 100%; border-radius: 20px 20px 0 0; margin: auto 0 0; }
      .modal-overlay { align-items: flex-end; padding: 0; }
      .counters-row { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="res-nav">
    <div class="res-nav-left">
      <a href="/" class="res-logo">
        <div class="res-logo-icon">👁️</div>
        <span class="res-logo-text">Eye In</span>
      </a>
      <div class="route-info-pill">
        <span>📍</span>
        <span id="routeInfoPill">Searching...</span>
      </div>
    </div>
    <div class="res-nav-right">
      <button onclick="openUserHistory()" class="nav-action-btn">📜 My Rides</button>
      <a href="/" class="nav-action-btn">🏠 Home</a>
    </div>
  </nav>

  <!-- Mobile Tab Switcher -->
  <div class="mobile-tabs">
    <div class="tab-row">
      <button class="mtab active" id="tabVehicles" onclick="showTab('vehicles')">🚗 Vehicles</button>
      <button class="mtab" id="tabMap" onclick="showTab('map')">🗺️ Map</button>
    </div>
  </div>

  <!-- Results Layout -->
  <div class="results-layout">
    <!-- Left: Vehicle List -->
    <div class="vehicle-list-panel" id="vehiclePanel">
      <div class="panel-top">
        <h2>🚗 Available Vehicles</h2>
        <div class="panel-subtitle" id="routeInfo">Searching...</div>
        <div class="vehicle-count-badge" id="vehicleCountBadge" style="display:none;">
          <span id="vehicleCount">0</span> vehicles found
        </div>
      </div>
      <div class="vehicles-container" id="vehicleList">
        <!-- Skeleton loading -->
        <div class="skeleton-card">
          <div class="skeleton-line" style="height:14px;width:70%;margin-bottom:8px;"></div>
          <div class="skeleton-line" style="height:10px;width:45%;margin-bottom:14px;"></div>
          <div class="skeleton-line" style="height:6px;width:100%;"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line" style="height:14px;width:65%;margin-bottom:8px;"></div>
          <div class="skeleton-line" style="height:10px;width:50%;margin-bottom:14px;"></div>
          <div class="skeleton-line" style="height:6px;width:100%;"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line" style="height:14px;width:60%;margin-bottom:8px;"></div>
          <div class="skeleton-line" style="height:10px;width:40%;margin-bottom:14px;"></div>
          <div class="skeleton-line" style="height:6px;width:100%;"></div>
        </div>
      </div>
    </div>

    <!-- Right: Map -->
    <div class="map-panel" id="mapPanel">
      <div id="map"></div>
    </div>
  </div>

  <!-- Vehicle Detail Modal -->
  <div class="modal-overlay" id="vehicleModal">
    <div class="modal-glass">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- User History Modal -->
  <div class="history-overlay" id="userHistoryModal">
    <div class="history-card">
      <div class="history-topbar">
        <span class="history-title">📜 Meri Rides</span>
        <button class="close-btn" onclick="closeUserHistory()">✕</button>
      </div>
      <div id="userHistoryPhoneSection">
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:12px;">Apna phone number daalein purani rides dekhne ke liye</p>
        <div class="phone-input-row">
          <span class="phone-input-prefix">🇮🇳 +91</span>
          <input type="tel" id="userHistoryPhone" class="phone-input-field" placeholder="10-digit mobile number" maxlength="10">
        </div>
        <button class="booking-submit-btn" onclick="fetchUserHistory()">Rides Dekho 🚀</button>
      </div>
      <div id="userHistoryList" style="display:none;" class="history-list"></div>
    </div>
  </div>

  <!-- Feedback FAB -->
  <button class="feedback-fab" onclick="openFeedback()" title="Send Feedback">💬</button>

  <!-- Feedback Modal -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-sheet">
      <div class="feedback-handle"></div>
      <div class="feedback-header">
        <span class="feedback-title">💬 Feedback Bhejo</span>
        <button class="close-btn" onclick="closeFeedback()">✕</button>
      </div>
      <div class="feedback-type-row">
        <button class="feedback-type-chip active" onclick="selectFeedbackType(this,'suggestion')">💡 Suggestion</button>
        <button class="feedback-type-chip" onclick="selectFeedbackType(this,'bug')">🐛 Bug</button>
        <button class="feedback-type-chip" onclick="selectFeedbackType(this,'praise')">⭐ Praise</button>
        <button class="feedback-type-chip" onclick="selectFeedbackType(this,'complaint')">⚠️ Complaint</button>
      </div>
      <div class="booking-input-wrap" style="margin-bottom:8px;">
        <span class="booking-input-icon">👤</span>
        <input type="text" id="fbName" class="booking-input" placeholder="Aapka naam (optional)">
      </div>
      <div class="booking-input-wrap" style="margin-bottom:10px;">
        <span class="booking-input-icon">📱</span>
        <span class="phone-prefix">+91</span>
        <input type="tel" id="fbPhone" class="booking-input" placeholder="Phone (optional)" maxlength="10">
      </div>
      <textarea id="fbMessage" class="feedback-textarea" placeholder="Aapka feedback likhein..."></textarea>
      <button class="feedback-submit" onclick="submitFeedback()">🚀 Submit Feedback</button>
    </div>
  </div>

  <!-- Driver Profile Modal -->
  <div class="dprofile-overlay" id="driverProfileModal">
    <div class="dprofile-card">
      <div id="driverProfileBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastBox"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>
